[files]
extend-exclude = [
  ".git/",     # Version control files
  "archive/*",  # Archive files
]

# Regex patterns for identifiers
[default]
extend-ignore-re = [
  "\\b(?:betwee|messag|openin|runnin)\\.mp3\\b",  # A real 8.3-truncated PrBoom DOS asset filenames (library/prboom.md)
  "2ND",                       # part of "Button 2ND" (library/numero.md)
  "ACCOMODATE_",               # ACCOMODATE_POSSIBLE_DYNAMIC_LOOPS, a real CRT-Royale shader macro (shader/crt_royale.md)
  "ba4980-c-sdk",              # Minimal C language development kit for BuBuGao (BBK) A-series electronic dictionaries
  "BLOAD",                     # MSX-BASIC BLOAD command (library/bluemsx.md)
  "CONSOL_(SELECT|START)",     # Atari 8-bit CONSOL_SELECT/CONSOL_START hardware register (library/atari800.md)
  "KEY_ALIS",                  # KEY_ALIS, an example keytool placeholder (development/retroarch/compilation/android.md)
  "Sentris",                   # Sentris, a real game title (image/Button_Pack/Readme.txt)
  "Sintax",                    # Sintax, a real Game Boy bootleg mapper (library/gearboy.md)
  "som_msu1.sfc",              # som_msu1.sfc, a real filename (library/snes9x.md)
  "textureLodOffset",          # GLSL textureLodOffset substring (development/shader/slang-shaders.md)
  "(?i).*lod.*",               # Level of Detail (LOD) substrings in identifiers, options, and paths
  "THQ",                       # THQ, a real video game publisher (library/compatibility/gba.md)
  "UPnP",                      # Universal Plug and Play
  "\\bVirtua\\b",              # Sega's specific branding used in game titles (Virtua Fighter, Virtua Cop, Virtua Racing, Virtua Gun)
]

# Match Inside a Word - Case Insensitive
[default.extend-words]
ue = "ue"          # Nestopia UE
sav = "sav"        # .sav file extension
kernal = "kernal"  # Commodore's low-level Operating System
gam = "gam"        # GAM4980 core name / .gam file extension
noo = "noo"        # NooDS core name (library/noods.md)
wirth = "wirth"    # Niklaus Wirth, designer of Oberon (library/oberon.md)
trak = "trak"      # TrakBall, a real Stella controller type (library/stella.md)
pn = "pn"          # UPnP substring (ppsspp.md, netplay-faq.md, netplay-getting-started.md)
bumpter = "bumpter"  # Vita_Bumpter_Left.png, a real Button_Pack asset filename
outter = "outter"    # Remote_Circle_Outter.png, ditto
tilda = "tilda"      # Keyboard_*_Tilda.png, ditto
cruzes = "cruzes"    # Cruzes, a real (stub) core entry (guides/core-list.md)
ment = "ment"        # part of "Greg DeMent", a real person's surname (library/prosystem.md)
hsi = "hsi"          # .hsi file extension (guides/softwarelist-getting-started.md)
updat = "updat"      # PS3UPDAT.PUP, the PS3 firmware file name (library/rpcs3.md)
discernable = "discernable"  # a widely-accepted alternate spelling of "discernible" (guides/rgui.md)
ba = "ba"            # part of the "ba4980-c-sdk" tool-repo URL slug (library/gam4980.md)
mis = "mis"          # part of the valid "mis-matched" hyphenation (guides/softwarelist-getting-started.md)
informations = "informations"  # only remaining match is the quick-informations.md FILENAME itself (kept as-is: many other pages link to it by this exact path); every genuine prose occurrence of this typo was fixed
rewinded = "rewinded"  # Technical term for rewinding process
wizzard = "wizzard"  # WizzardSK, a real GitHub username (library/cemu.md, library/pcee2.md, library/armsx2.md, library/nuance.md)
ahd = "ahd"          # a real Hatari option value (library/hatarib.md)
langage = "langage"  # LANGAGE, a real EmuSCV core option name (library/emuscv.md)
