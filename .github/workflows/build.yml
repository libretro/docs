# Build check: fail pull requests that break the site build,
# a documentation link, or a heading anchor.

name: Build Docs

permissions:
  contents: read

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build with mkdocs --strict
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history for the git-revision-date-localized plugin
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build site
        run: mkdocs build --strict
