# Spell checker

name: Typos Action

permissions:
  contents: read

on:
  pull_request:
    branches: [master]

jobs:
  spelling:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Actions Repository
      uses: actions/checkout@v5
    - name: Spell Check Repo
      uses: crate-ci/typos@v1.48.0
